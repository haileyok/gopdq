name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 1.25.5 mirrors the minimum Go version declared in go.mod (what
        # consumers on older toolchains build with); 1.26 is the latest line
        # used in development.
        go-version: ["1.25.5", "1.26"]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v
