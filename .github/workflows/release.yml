name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify
        run: |
          go build ./...
          go vet ./...

      - name: Verify tag still points at the pushed commit
        # The sanity gate above ran against the event's SHA. --verify-tag only
        # checks the tag exists, so assert it has not been moved before
        # creating a release against it.
        run: |
          test "$(git ls-remote origin "refs/tags/${GITHUB_REF_NAME}" | awk '{print $1}')" = "${GITHUB_SHA}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
